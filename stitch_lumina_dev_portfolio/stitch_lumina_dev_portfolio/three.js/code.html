<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width,initial-scale=1.0" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_2 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_2" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_2');
  const devicePixelRatio = window.devicePixelRatio || 1;
  
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });

renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// Create a futuristic "Brain/Core" representation for AI
const group = new THREE.Group();
scene.add(group);

// Central Core
const coreGeom = new THREE.SphereGeometry(1, 32, 32);
const coreMat = new THREE.MeshPhongMaterial({
    color: 0x6C63FF,
    emissive: 0x6C63FF,
    emissiveIntensity: 0.5,
    shininess: 100,
    transparent: true,
    opacity: 0.8
});
const core = new THREE.Mesh(coreGeom, coreMat);
group.add(core);

// Orbital rings
const createRing = (radius, color, rotationX, rotationY) => {
    const ringGeom = new THREE.TorusGeometry(radius, 0.02, 16, 100);
    const ringMat = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.5 });
    const ring = new THREE.Mesh(ringGeom, ringMat);
    ring.rotation.x = rotationX;
    ring.rotation.y = rotationY;
    return ring;
};

const ring1 = createRing(1.5, 0x8B5CF6, Math.PI / 2, 0.2);
const ring2 = createRing(1.8, 0xA855F7, 0.5, Math.PI / 4);
const ring3 = createRing(2.1, 0x6C63FF, -0.5, -0.2);

group.add(ring1);
group.add(ring2);
group.add(ring3);

// Floating particles
const particlesCount = 200;
const positions = new Float32Array(particlesCount * 3);
for (let i = 0; i < particlesCount * 3; i++) {
    positions[i] = (Math.random() - 0.5) * 10;
}
const particlesGeom = new THREE.BufferGeometry();
particlesGeom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
const particlesMat = new THREE.PointsMaterial({
    color: 0xFFFFFF,
    size: 0.05,
    transparent: true,
    opacity: 0.3
});
const particles = new THREE.Points(particlesGeom, particlesMat);
scene.add(particles);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);
const pointLight = new THREE.PointLight(0x6C63FF, 2, 10);
pointLight.position.set(5, 5, 5);
scene.add(pointLight);

camera.position.z = 6;

// Mouse Interaction
let mouseX = 0;
let mouseY = 0;
window.addEventListener('mousemove', (e) => {
    mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
    mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
});

const animate = () => {
    requestAnimationFrame(animate);
    
    group.rotation.y += 0.005;
    group.rotation.x += 0.002;
    
    ring1.rotation.z += 0.01;
    ring2.rotation.z -= 0.008;
    ring3.rotation.z += 0.012;
    
    // Subtle mouse follow
    group.rotation.y += (mouseX * 0.5 - group.rotation.y) * 0.05;
    group.rotation.x += (mouseY * 0.5 - group.rotation.x) * 0.05;
    
    particles.rotation.y += 0.001;
    
    renderer.render(scene, camera);
};

animate();

window.addEventListener('resize', () => {
    const newWidth = container.clientWidth || window.innerWidth;
    const newHeight = container.clientHeight || window.innerHeight;
    camera.aspect = newWidth / newHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(newWidth, newHeight);
});

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_2 -->


</body></html>
