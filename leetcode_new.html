  }
  #scroll-progress-fill {
    width: 100%;
    height: 0%;
    background: 
      repeating-linear-gradient(45deg, rgba(255,255,255,0.08) 0px, rgba(255,255,255,0.08) 12px, rgba(255,255,255,0) 12px, rgba(255,255,255,0) 24px),
      linear-gradient(180deg, #3d229e, #7b61ff, #e2c2ff, #7b61ff, #3d229e);
    background-size: 100% 48px, 100% 200%;
    animation: magma-flow 1.5s linear infinite;
    box-shadow: 
      0 0 16px rgba(123, 97, 255, 0.9), 
      inset 2px 0 4px rgba(255, 255, 255, 0.9), 
      inset -2px 0 6px rgba(61, 34, 158, 0.9);
    border-radius: 12px;
    will-change: height;
    transition: height 0.1s ease-out;
  }
  @keyframes magma-flow {
    0% { background-position: 0 0, 0 200%; }
    100% { background-position: 0 48px, 0 -200%; }
  }
  /* Hide default browser scrollbar */
  ::-webkit-scrollbar {
    display: none;
  }
  html {
    scrollbar-width: none; /* Firefox */
    -ms-overflow-style: none; /* IE/Edge */
  }
</style>
<div id="scroll-progress-container">

</div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const scrollFill = document.getElementById('scroll-progress-fill');
    if (!scrollFill) return;
    let ticking = false;
    const updateScrollProgress = () => {
      const scrollTop = window.scrollY || document.documentElement.scrollTop;
      const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      const scrollPercentage = scrollHeight > 0 ? (scrollTop / scrollHeight) * 100 : 0;
      scrollFill.style.height = scrollPercentage + '%';
      ticking = false;
    };
    window.addEventListener('scroll', () => {
      if (!ticking) {
        window.requestAnimationFrame(updateScrollProgress);
        ticking = true;
      }
    }, { passive: true });
    updateScrollProgress(); // init
  });
</script>
<!-- End Premium Scroll Progress Indicator -->
